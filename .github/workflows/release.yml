name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vX.Y.Z (received: $tag)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Run tests
        working-directory: apps/macos
        run: |
          swift test
          swift run RememberThisUnitTests
      - name: Build release archive
        working-directory: apps/macos
        run: BUILD_NUMBER="${{ github.run_number }}" bash scripts/package-app.sh "${{ steps.version.outputs.value }}"
      - name: Build iOS simulator release artifact
        working-directory: apps/ios/RememberThisIOS
        run: >-
          xcodebuild build
          -project RememberThisIOS.xcodeproj
          -scheme RememberThisIOS
          -sdk iphonesimulator
          -configuration Release
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
      - name: Package iOS simulator release artifact
        working-directory: apps/ios/RememberThisIOS
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "build/Build/Products/Release-iphonesimulator/Remember This.app" \
            "dist/Remember-This-iOS-simulator-${{ steps.version.outputs.value }}.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "apps/macos/dist/Remember-This-${{ steps.version.outputs.value }}.zip" \
            "apps/macos/dist/Remember-This-${{ steps.version.outputs.value }}.zip.sha256" \
            "apps/ios/RememberThisIOS/dist/Remember-This-iOS-simulator-${{ steps.version.outputs.value }}.zip" \
            --title "Remember This ${{ steps.version.outputs.value }}" \
            --generate-notes
