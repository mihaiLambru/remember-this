name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vX.Y.Z (received: $tag)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: |
          swift test
          swift run RememberThisUnitTests
      - name: Build release archive
        run: BUILD_NUMBER="${{ github.run_number }}" bash scripts/package-app.sh "${{ steps.version.outputs.value }}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/Remember-This-${{ steps.version.outputs.value }}.zip" \
            "dist/Remember-This-${{ steps.version.outputs.value }}.zip.sha256" \
            --title "Remember This ${{ steps.version.outputs.value }}" \
            --generate-notes
